<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        var stored = localStorage.getItem('fate-theme') || localStorage.getItem('nexus-theme')
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.setAttribute('data-theme', theme)
        document.documentElement.lang = 'ru'
      } catch (e) {}
    </script>
